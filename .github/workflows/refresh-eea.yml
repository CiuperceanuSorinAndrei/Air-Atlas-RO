name: Refresh EEA observations

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-eea
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
      - name: Require an approved code release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Choose metadata cache key
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/eea_station_metadata.json
          key: eea-metadata-${{ steps.cache-date.outputs.date }}
          restore-keys: eea-metadata-
      - name: Import EEA observations
        run: uv run --locked python scripts/import_eea.py
      - name: Verify generated snapshot
        run: |
          uv run --locked python scripts/import_eea.py --check src/data/observations.json
          uv run --locked pytest tests/test_import_eea.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-snapshot
          path: src/data/observations.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.collect.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-snapshot
          path: candidate
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
      - name: Recheck approved application assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Revalidate publication boundary
        run: |
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from scripts.import_eea import write_observation_snapshot
          document = json.loads(Path('candidate/observations.json').read_text())
          write_observation_snapshot(document, Path('src/data/observations.json'))
          PY
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/observations.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged'
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != 'src/data/observations.json' ]; then
            echo 'Publication may change only observations.json'
            exit 1
          fi
          git commit -m 'data: refresh EEA observations'
          candidate="refresh-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate"
          trap 'git push origin --delete "$candidate" || true' EXIT
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          result = {
              'name': 'production-checks',
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': 'completed',
              'conclusion': 'success',
              'output': {
                  'title': 'Verified EEA snapshot',
                  'summary': 'Importer tests, schema and coverage/regression guards passed. Only observations.json changed; unchanged code has a matching successfully deployed approved-site artifact. Freshness is monitored separately.',
              },
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'snapshot-check.json'
          path.write_text(json.dumps(result))
          subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", '--input', str(path)], check=True, stdout=subprocess.DEVNULL)
          PY
          git push origin HEAD:main
