name: Refresh EEA observations

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      initialize-state:
        description: Start a new controlled-degradation lineage from the public snapshot
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-eea
  cancel-in-progress: false

env:
  ATLAS_REGISTRY_MANIFEST: data/eea/registries/v1/manifest.json

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.ATLAS_CONTROLLED_REFRESH != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.13'
      - name: Require an approved code release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Choose metadata cache key
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/eea_station_metadata.json
          key: eea-metadata-${{ steps.cache-date.outputs.date }}
          restore-keys: eea-metadata-
      - name: Import EEA observations
        run: uv run --locked python scripts/import_eea.py
      - name: Verify generated snapshot
        run: |
          uv run --locked python scripts/import_eea.py --check src/data/observations.json
          uv run --locked pytest tests/test_import_eea.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-snapshot
          path: src/data/observations.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.collect.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-snapshot
          path: candidate
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.13'
      - name: Recheck approved application assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Revalidate publication boundary
        run: |
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from scripts.import_eea import write_observation_snapshot
          document = json.loads(Path('candidate/observations.json').read_text())
          write_observation_snapshot(document, Path('src/data/observations.json'))
          PY
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_snapshot.sh
  controlled-collect:
    if: github.ref == 'refs/heads/main' && (vars.ATLAS_CONTROLLED_REFRESH == 'shadow' || vars.ATLAS_CONTROLLED_REFRESH == 'on')
    continue-on-error: ${{ vars.ATLAS_CONTROLLED_REFRESH == 'shadow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.13'
      - name: Require an approved code release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Collect a controlled-degradation run
        env:
          INITIALIZE: ${{ inputs.initialize-state == true }}
        run: |
          if [ "$INITIALIZE" = true ]; then
            lineage=(--initialize-state --previous-snapshot src/data/observations.json)
          else
            git fetch --no-tags --depth=1 origin refresh-state
            mkdir "$RUNNER_TEMP/previous"
            git archive FETCH_HEAD run | tar -x -C "$RUNNER_TEMP/previous"
            lineage=(--previous-run "$RUNNER_TEMP/previous/run")
          fi
          uv run --locked python -m scripts.import_eea \
            --registry-manifest "$ATLAS_REGISTRY_MANIFEST" --controlled-degradation \
            "${lineage[@]}" --output-directory "$RUNNER_TEMP/controlled-run" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-run
          path: ${{ runner.temp }}/controlled-run
          retention-days: 1
          if-no-files-found: error
  controlled-publish:
    needs: controlled-collect
    continue-on-error: ${{ vars.ATLAS_CONTROLLED_REFRESH == 'shadow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.controlled-collect.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: controlled-run
          path: ${{ runner.temp }}/controlled-run
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.13'
      - name: Recheck approved application assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/approved_site.py
      - name: Verify lineage and persist controlled state
        env:
          INITIALIZE: ${{ inputs.initialize-state == true }}
        run: bash scripts/persist_refresh_state.sh "$RUNNER_TEMP/controlled-run" "$INITIALIZE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the accepted controlled snapshot
        if: vars.ATLAS_CONTROLLED_REFRESH == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python -m scripts.publish_controlled_run \
            --registry-manifest "$ATLAS_REGISTRY_MANIFEST" --run "$RUNNER_TEMP/controlled-run" \
            --production-approval data/eea/registries/v1/production-approval.json \
            --export src/data/observations.json | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_snapshot.sh
