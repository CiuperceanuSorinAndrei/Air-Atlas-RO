name: Monitor served air quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.4'
          python-version: '3.13'
      - name: Check publicly served freshness and coverage
        run: uv run --locked python -m scripts.check_served_data "https://ciuperceanusorinandrei.github.io/Air-Atlas-RO/observations.json?monitor=${GITHUB_RUN_ID}"
